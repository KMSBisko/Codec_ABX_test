name: ci
on:
  push:
  pull_request:

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps (no Qt / no audio backend required)
        run: python -m pip install -r requirements-dev.txt
      - name: Test statistics, blinding, alignment, web API (no ffmpeg required)
        run: python -m pytest -q -m "not pipeline"
      - name: Compile every module
        run: python -m compileall -q core app web run_abx.py

  # The codec pipeline needs ffmpeg and the shared audio extras; this is where
  # a real run is exercised. requirements-audio.txt is not optional here: with
  # dev deps only, every pipeline module import-skips and the suite verifies
  # nothing. Failures propagate; a junit summary fails the job when the suite
  # collects no tests or any test is skipped (missing deps/ffmpeg on the
  # runner). tests/test_ci_contract.py guards this contract.
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps (dev + shared audio preparation extras)
        run: python -m pip install -r requirements-dev.txt -r requirements-audio.txt
      - name: Generate example audio
        run: python tools/generate_example_audio.py
      - name: Run the ffmpeg pipeline suite (failures propagate)
        run: |
          python -m pytest -q -m pipeline --junitxml=pipeline-report.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pipeline-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"pipeline suite: {tests} tests, {skipped} skipped, {failed} failed")
          if tests == 0:
              sys.exit("pipeline suite collected no tests — the suite is empty")
          if skipped:
              sys.exit(f"pipeline suite skipped {skipped} tests — audio deps or ffmpeg missing")
          if failed:
              sys.exit(f"pipeline suite failed {failed} tests")
          PY
