name: ci
on:
  push:
  pull_request:

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps (no Qt / no audio backend required)
        run: python -m pip install -r requirements-dev.txt
      - name: Test statistics, blinding, alignment, web API
        run: python -m pytest -q
      - name: Compile every module
        run: python -m compileall -q core app web run_abx.py

  # The codec pipeline needs ffmpeg; this is where a real run is exercised.
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: python -m pip install -r requirements-dev.txt
      - name: Generate example audio and run the pipeline end to end
        run: |
          python tools/generate_example_audio.py
          python -m pytest -q -m pipeline || echo "pipeline suite pending"
